<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">

    <title>Профиль карьеры: расширенный тест</title>
    <style>
        :root {
            --bg: #eef1f5;
            --card: #fff;
            --ink: #14213d;
            --mut: #5b6678;
            --acc: #1f6f8b;
            --line: #d5dbe4;
            --on: #fff;
            --sel: #14213d;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: inherit
        }

        html {
            color-scheme: light
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif
        }

        main {
            max-width: 680px;
            margin: 0 auto;
            padding: 20px 16px 48px
        }

        h1 {
            font-size: 28px;
            line-height: 1.15;
            margin: 8px 0 12px
        }

        h2 {
            font-size: 20px;
            margin: 22px 0 8px
        }

        h3 {
            font-size: 16px;
            margin: 14px 0 4px
        }

        p {
            margin: 0 0 10px
        }

        .mut {
            color: var(--mut)
        }

        .sm {
            font-size: 14px
        }

        .bar {
            height: 6px;
            background: var(--line);
            border-radius: 3px;
            overflow: hidden;
            margin: 4px 0 14px
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--acc)
        }

        .q,
        .top {
            background: var(--card);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--line)
        }

        .q span {
            display: block;
            margin-bottom: 10px
        }

        .s {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px
        }

        .o {
            display: grid;
            gap: 6px
        }

        .s button,
        .o button {
            font: inherit;
            padding: 11px 8px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            text-align: left
        }

        .s button {
            text-align: center;
            font-weight: 600
        }

        .on {
            background: var(--sel) !important;
            color: var(--on) !important;
            border-color: var(--sel) !important
        }

        .btn {
            font: inherit;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 12px;
            border: 0;
            background: var(--sel);
            color: var(--on);
            cursor: pointer;
            width: 100%
        }

        .btn.g {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);
            margin-top: 8px
        }

        .btn:disabled {
            opacity: .4
        }

        button:focus-visible {
            outline: 3px solid var(--acc);
            outline-offset: 2px
        }

        .rn {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-top: 8px
        }

        .tr {
            position: relative;
            height: 10px;
            background: var(--line);
            border-radius: 5px;
            margin-top: 3px
        }

        .tr:after {
            content: "";
            position: absolute;
            left: 50%;
            top: -3px;
            bottom: -3px;
            width: 2px;
            background: var(--mut)
        }

        .tr i {
            position: absolute;
            top: 0;
            bottom: 0;
            background: var(--acc);
            border-radius: 5px
        }

        ol {
            padding-left: 22px;
            margin: 4px 0
        }

        li {
            margin: 3px 0
        }

        @media print {
            .btn {
                display: none
            }

            body {
                background: #fff
            }

            .top,
            .q {
                break-inside: avoid
            }
        }

        .tmr {
            position: sticky;
            top: 8px;
            z-index: 9;
            background: #14213d;
            color: #fff;
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            margin: 10px 0;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .3)
        }

        .tmr.low {
            background: #c62828
        }

        .lost {
            border-color: #c62828;
            color: #c62828;
            font-weight: 600
        }

        .q button:disabled {
            opacity: .45;
            cursor: not-allowed
        }
    </style>
</head>
