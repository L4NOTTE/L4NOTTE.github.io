*{box-sizing:inherit}html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

h1{font-size:28px;line-height:1.15;margin:8px 0 12px}h2{font-size:20px;margin:22px 0 8px}h3{font-size:16px;margin:14px 0 4px}

.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.q,.top{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.q span{display:block;margin-bottom:10px}
.s{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.o{display:grid;gap:6px}
.s button,.o button{font:inherit;padding:11px 8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.s button{text-align:center;font-weight:600}
.on{background:var(--sel)!important;color:var(--on)!important;border-color:var(--sel)!important}
.btn{font:inherit;font-weight:600;padding:14px 20px;border-radius:12px;border:0;background:var(--sel);color:var(--on);cursor:pointer;width:100%}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}.btn:disabled{opacity:.4}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.rn{display:flex;justify-content:space-between;font-size:14px;margin-top:8px}
.tr{position:relative;height:10px;background:var(--line);border-radius:5px;margin-top:3px}
.tr:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--mut)}
.tr i{position:absolute;top:0;bottom:0;background:var(--acc);border-radius:5px}
ol{padding-left:22px;margin:4px 0}li{margin:3px 0}
@media print{.btn{display:none}body{background:#fff}.top,.q{break-inside:avoid}}
.tmr{position:sticky;top:8px;z-index:9;background:#14213d;color:#fff;font-size:32px;font-weight:800;text-align:center;padding:10px;border-radius:12px;margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.3)}.tmr.low{background:#c62828}.lost{border-color:#c62828;color:#c62828;font-weight:600}.q button:disabled{opacity:.45;cursor:not-allowed}
</style>

cP:["Вам интересно создавать собственное дело и искать возможности. Вероятны запуск проекта, фриланс, продажи с процентом. Заранее оцените риски и накопите финансовый запас.","Свой бизнес вас не привлекает: нестабильность и риск отпугивают. Комфортнее работа по найму с понятной зарплатой и обязанностями."],
cC:["Вы получаете энергию от общения с клиентами и переговоров. Хороши сервис, продажи, консультирование, организация мероприятий. Учитесь не принимать отказы на свой счёт.","Постоянные контакты и презентации вас утомляют. Подойдёт работа с дозированным общением, где основную часть задач выполняют самостоятельно."],
cI:["Вы тянетесь создавать новое: продукты, дизайн, технологии, форматы. Подойдут разработка, креатив, проектирование. Важны свобода и право на эксперимент.","Придумывать новое вам не особенно интересно: вы предпочитаете отработанные решения и стабильный результат."],
cS:["Вам важно стать настоящим профессионалом узкой области, вы готовы годами оттачивать мастерство. Следите за рынком, чтобы специализация не устарела.","Идти вглубь одной профессии вам скучно, вас привлекает разнообразие задач. Универсальные и проектные роли подойдут лучше."],
cF:["Вам комфортно обеспечивать работу организации: учёт, документы, снабжение, поддержка. Вы цените порядок и ясные процессы, а в них ценят вашу надёжность.","Рутинная работа с документами и регламентами вас не вдохновляет. Вам нужны динамика, самостоятельные решения и видимый результат."],
cA:["Вы любите разбираться в причинах и закономерностях, работать с данными и схемами. Хороши аналитика, исследования, диагностика. Проверяйте выводы на практике.","Длительный анализ информации вас утомляет. Вы лучше действуете по ситуации, опираясь на опыт, а не на расчёты."],
cD:["Вы умеете планировать, контролировать сроки и поддерживать порядок. Подойдут координация, администрирование, логистика. Гибкость при этом тоже стоит тренировать.","Следить за регламентами и сроками вам скучно, вы склонны импровизировать. Если работа требует контроля, подберите систему напоминаний."],
mi:["Для вас важнее всего, чтобы работа увлекала, а рутина быстро убивает мотивацию. Выбирайте сферу по интересу: так вы будете расти быстрее.","Вы готовы работать без особого интереса к самому делу, если условия устраивают. Это даёт устойчивость, но следите, чтобы не наступило безразличие."],
md:["Вам нужны гарантии: стабильная зарплата, надёжный работодатель, понятное будущее. Рекомендуем крупные компании и государственный сектор.","Стабильность для вас не главное: вы готовы менять работу и рисковать ради нового. Заведите финансовую подушку, чтобы перемены не били по бюджету."],
mc:["Комфортные условия труда и удобный график для вас серьёзный критерий выбора. Смотрите на режим, нагрузку и дорогу до работы.","Вы терпимы к неудобствам, если дело того стоит. Но не забывайте про отдых, иначе переработки накопятся."],
mt:["Вам нужна возможность воплощать свои идеи и действовать по-своему, жёсткий контроль раздражает. Ищите среду, где приветствуют инициативу.","Творческая самореализация в работе вам не обязательна: вы можете получать удовольствие от чёткого выполнения задач."],
mm:["Доход для вас один из главных стимулов, вы готовы работать больше ради результата. Присматривайтесь к должностям с процентами и бонусами, но не жертвуйте здоровьем.","Деньги не главный мотив: вы выберете интересную работу с умеренной оплатой. Следите, чтобы доход покрывал ваши потребности."],
mr:["Атмосфера в коллективе для вас важна не меньше задач, вы хорошо работаете там, где вас ценят. Токсичная среда будет разрушать мотивацию.","Коллектив для вас второстепенен, вы сосредоточены на задаче. Поддерживайте рабочие связи, они пригодятся для роста."],
mo:["Вас заводят трудные задачи и азарт, вы готовы рисковать, чтобы проверить себя. Хорошо подходят динамичные, соревновательные сферы.","Вы избегаете лишнего риска и перегрузок. Вам лучше подойдёт ровный ритм и предсказуемые задачи."],
mp:["Вам важны статус должности и известность компании, престижная организация даст дополнительную мотивацию. Не выбирайте только за громкое имя: смотрите на содержание работы.","Престиж и статусные символы вас не волнуют. Вы выберете место по содержанию работы и людям, а не по названию."],
pE:["Вы открыты людям, легко заводите знакомства и заряжаетесь от общения. Подойдут командная работа и публичные роли.","Шумное общение быстро утомляет, вам нужно время на восстановление в тишине."],
pI:["Вы сосредоточены на внутреннем мире и лучше работаете в спокойной обстановке. Глубокие задачи удаются вам лучше, чем бесконечные совещания.","Вы мало нуждаетесь в одиночестве и комфортно чувствуете себя в постоянном окружении людей."],
pS:["Вы опираетесь на факты, проверенный опыт и конкретику, хорошо замечаете детали. Иногда допускайте и нестандартные варианты.","Опора только на факты вам не свойственна: вы чаще доверяете общему впечатлению и перспективам."],
pN:["Вы видите общую картину, доверяете интуиции и охотно строите прогнозы. Проверяйте догадки фактами, прежде чем действовать.","Предчувствия и смутные догадки вас мало убеждают, вы доверяете тому, что можно проверить."],
pT:["Решения вы принимаете по логике и стараетесь оценивать ситуацию трезво. Подойдут аналитика, техника, управление процессами. Учитывайте и эмоциональный фон людей.","Чисто логический расчёт для вас не главный довод: вы чаще учитываете отношения и последствия для людей."],
pF:["Вы тонко чувствуете настроение людей и стараетесь сохранять добрые отношения. Хороши роли, где важны эмпатия и поддержка. Не принимайте чужие проблемы слишком близко.","Эмоции других вы учитываете меньше, чем факты и правила, это может выглядеть как холодность. Проговаривайте своё отношение вслух."],
pP:["Вы заранее планируете, любите порядок и доводите начатое до конца. Оставляйте запас времени на непредвиденное.","Жёсткие планы вам мешают: вы быстрее включаетесь, когда сами выбираете момент."],
pM:["Вы быстро адаптируетесь, любите действовать по обстановке и менять подход. Подходит динамичная среда. Для сроков заведите внешние ориентиры.","Менять планы на ходу вам некомфортно: вам нужны ясность и последовательность."],
pD:["Вы берёте лидерство, отстаиваете позицию и влияете на решения. Подойдут руководящие роли. Следите, чтобы настойчивость не подавляла других.","Вы редко настаиваете на своём и охотно уступаете. В команде это помогает, а в переговорах тренируйте уверенность."],
pY:["Вы гибки в конфликтах и готовы идти на компромисс, это ценно в команде. Учитесь при этом отстаивать границы.","Уступать вам тяжело, вы стараетесь добиться своего. Полезно тренировать умение слышать оппонента."],
aC:["Вы быстро и точно считаете. Хороши финансы, инженерия, программирование, аналитика.","Вычисления даются с усилием. Подойдут профессии без интенсивной математики, а счёт в уме можно тренировать."],
aL:["У вас богатый словарный запас и хорошая речь. Подойдут профессии с текстами, переговорами, обучением.","Словарный запас ниже среднего, тексты и выступления даются с усилием. Больше читайте и пишите."],
aE:["У вас широкий кругозор. Это помогает в консультировании, образовании, журналистике, управлении.","Общая осведомлённость невысокая. Читайте научно-популярную литературу и образовательные материалы."],
aV:["Вы хорошо работаете с чертежами, схемами и пространственными образами. Подойдут конструирование, дизайн, строительство.","Чертежи и пространственные задачи даются труднее. Лучше выбирать профессии, не завязанные на конструкторскую графику."],
aA:["Вы уверенно строите логические выводы и работаете с абстракциями. Подойдут право, аналитика, программирование, наука.","Абстрактные рассуждения даются тяжелее. Решайте логические задачи и строите аргументацию по шагам."],
aT:["Вы устойчиво концентрируетесь и замечаете детали. Подходит работа с документами, цифрами, контролем качества.","Концентрация пока нестабильна. Выработайте режим дня, делайте перерывы и упражнения на внимание."]};
var IN=[["Это одна из ваших самых выраженных сторон. ","Здесь у вас явный перевес. ","Результат заметно выше среднего. ","Ярко выраженная особенность вашего профиля. "],["Показатель выше среднего. ","Склонность выражена достаточно ясно. ","Эта сторона развита хорошо. ","Можно уверенно сказать, что это про вас. "],["Выражено в средней степени: это не ведущая линия, но и не слабое место. ","Умеренный результат: опираться на это можно по необходимости. ","Нейтральный показатель без перекоса в какую-либо сторону. ","Середина шкалы: вы можете проявлять это по ситуации. "],["Показатель ниже среднего. ","Эта сторона выражена слабо. ","Баллы здесь невысокие. ","Это скорее не про вас. "],["Показатель очень низкий. ","Практически не проявляется. ","Это явно не ваша зона. ","Здесь у вас выраженный минимум. "]];
var PF=[[["Вероятный прогноз: в новых и неопределённых ситуациях вы действуете увереннее большинства. Следите, чтобы собственный темп не оставлял команду позади.","Вероятный прогноз: вы быстро накапливаете опыт и находите возможности. Иногда останавливайтесь и проверяйте, куда ведут принятые решения.","Вероятный прогноз: такая установка поддерживает карьерный рост, особенно в первые годы. Не забывайте закладывать время на отдых."],["Вероятный прогноз: в зависимости от обстановки вы ведёте себя по-разному. Это даёт гибкость, но лучше заранее решить, что для вас важнее.","Вероятный прогноз: установка слабо влияет на выбор профессии. Опирайтесь на более яркие шкалы.","Вероятный прогноз: вы хорошо подстраиваетесь под условия. Всё же сформулируйте хотя бы одну долгосрочную цель."],["Вероятный прогноз: в нестандартных ситуациях вам понадобится больше времени на решение. Выбирайте среду, где есть наставник и понятные задачи.","Вероятный прогноз: на старте карьеры лучше работать в команде с чёткими ожиданиями. Постепенно расширяйте зону самостоятельности.","Вероятный прогноз: такая установка не мешает работать, но замедляет рост. Попробуйте брать по одной новой задаче в месяц."]],
[["Вероятный прогноз: работа в этом направлении будет приносить удовлетворение, сил на неё хватит надолго. Рекомендация: ищите вакансии, где это составляет не меньше половины обязанностей.","Вероятный прогноз: вы быстро освоите смежные профессии этого направления. Рекомендация: уже во время учёбы пробуйте практику или стажировку.","Вероятный прогноз: интерес устойчивый, он поможет пережить трудный период обучения. Рекомендация: проверьте себя на реальной задаче, прежде чем окончательно выбирать специальность."],["Вероятный прогноз: это направление может быть частью работы, но не её основой. Рекомендация: рассматривайте его как дополнительный навык.","Вероятный прогноз: интерес зависит от конкретных задач. Рекомендация: попробуйте небольшой проект, чтобы понять, нравится ли это на практике.","Вероятный прогноз: по этой шкале вы нейтральны. Рекомендация: строить выбор лучше на более сильных интересах."],["Вероятный прогноз: работа, построенная на этом, будет казаться тяжёлой и быстро надоест. Рекомендация: исключите такие позиции из основного списка.","Вероятный прогноз: вряд ли вы получите удовольствие от этой деятельности. Рекомендация: если без неё не обойтись, сведите её к минимуму.","Вероятный прогноз: направление вам чуждо, хотя отдельные задачи вы выполните. Рекомендация: не выбирайте профессию, где оно главное."]],
[["Вероятный прогноз: способность даст заметное преимущество в учёбе и на работе. Рекомендация: выбирайте специальности, где она востребована, и не давайте ей застояться.","Вероятный прогноз: вы справитесь со сложными задачами этого типа даже при нехватке времени. Рекомендация: развивайте навык дальше, это ваш козырь в резюме.","Вероятный прогноз: вы быстро освоите материал, где это нужно. Рекомендация: берите задачи повышенной сложности, чтобы не терять форму."],["Вероятный прогноз: уровня достаточно для большинства профессий. Рекомендация: если навык ключевой для специальности, тренируйте его регулярно.","Вероятный прогноз: в спокойной обстановке вы справляетесь, под давлением времени возможны ошибки. Рекомендация: тренируйтесь на задачах с таймером.","Вероятный прогноз: способность не станет ни сильным, ни слабым местом. Рекомендация: подтягивайте её, если она нужна выбранной профессии."],["Вероятный прогноз: в профессиях, где навык ключевой, придётся прикладывать больше усилий. Рекомендация: начните тренировки сейчас, по 15 минут в день.","Вероятный прогноз: на таких задачах вы можете терять время и ошибаться. Рекомендация: выбирайте направление, где это не главное, или готовьтесь развивать навык.","Вероятный прогноз: результат мог зависеть от скорости и усталости. Рекомендация: пройдите блок ещё раз в спокойной обстановке, прежде чем делать выводы."]],
[["Вероятный прогноз: если работа даёт это, вы будете держаться за неё и работать с отдачей. Рекомендация: уточняйте этот пункт на собеседовании.","Вероятный прогноз: без этого фактора мотивация быстро упадёт, даже если остальное устраивает. Рекомендация: заранее выясняйте условия.","Вероятный прогноз: этот мотив станет главным при выборе места работы. Рекомендация: сравнивайте предложения именно по нему."],["Вероятный прогноз: этот фактор желателен, но не решающий. Рекомендация: сопоставляйте его с более важными мотивами.","Вероятный прогноз: вы легко адаптируетесь к разным условиям. Рекомендация: опирайтесь на более выраженные мотивы.","Вероятный прогноз: мотив нейтральный и не повлияет на выбор. Рекомендация: смотрите на ведущие мотивы."],["Вероятный прогноз: нехватка этого вас почти не расстроит. Рекомендация: можно идти на компромисс по этому пункту ради более важного.","Вероятный прогноз: фактор не удержит вас на работе и не заставит уйти. Рекомендация: не делайте его критерием выбора.","Вероятный прогноз: вы легко обойдётесь без этого. Рекомендация: убедитесь, что не недооцениваете его: со временем потребности меняются."]],
[["Вероятный прогноз: черта заметна окружающим и определяет ваш стиль работы. Рекомендация: подбирайте роль, где она считается преимуществом.","Вероятный прогноз: в стрессе эта черта усиливается. Рекомендация: учитесь осознанно уравновешивать её противоположностью.","Вероятный прогноз: коллеги быстро заметят эту особенность. Рекомендация: заранее объясняйте свой стиль команде."],["Вероятный прогноз: вы ведёте себя по-разному в зависимости от ситуации. Рекомендация: это преимущество, развивайте гибкость.","Вероятный прогноз: черта не создаст ни проблем, ни особых преимуществ. Рекомендация: смотрите на более яркие качества.","Вероятный прогноз: на разных работах вы проявите себя по-разному. Рекомендация: сознательно выбирайте стиль под задачу."],["Вероятный прогноз: противоположная черта выражена сильнее и определяет ваш стиль. Рекомендация: подберите роль под неё.","Вероятный прогноз: там, где эта черта нужна, вам будет некомфортно. Рекомендация: тренируйте её постепенно, без насилия над собой.","Вероятный прогноз: вы редко проявляете эту сторону. Рекомендация: не считайте это недостатком, это просто другой стиль."]]];

cM:["В работе это значит ставить задачи, согласовывать сроки, разбирать конфликты, отвечать за итог перед руководством. Хорошие стартовые роли: бригадир, старший смены, координатор проекта, администратор.","управленческая роль требует выдержки: придётся принимать непопулярные решения и отвечать за чужие ошибки. Без опыта и профильных знаний авторитет не складывается, поэтому начинайте с небольшого участка.","если управлять людьми не тянет, рост не закрыт: можно двигаться по экспертной линии (ведущий специалист, архитектор, консультант), где отвечаешь за качество, а не за подчинённых."],
cP:["В повседневности это поиск идей и клиентов, проверка гипотез, самостоятельный учёт денег и рисков. Подойдут небольшой бизнес, студия, магазин, ИП в услугах, а также внутренние стартап-проекты в компании.","предпринимательство требует нервов и запаса прочности: доход бывает нерегулярным, а отдыха мало. Многие начинают параллельно с работой, чтобы не терять стабильность.","отсутствие тяги к бизнесу не мешает успеху: найм даёт зарплату, соцпакет и меньше ответственности. Если когда-нибудь захотите своё дело, начните с подработки или партнёрства."],
cC:["Это ежедневные переговоры, консультации, презентации, работа с возражениями. Подойдут менеджер по продажам, администратор, специалист по работе с клиентами, организатор мероприятий, рекрутёр.","общение отнимает много энергии, а отказы и негатив клиентов воспринимаются остро. Планируйте паузы и учитесь отделять личное от рабочего.","если контакты вы не любите, полностью без общения не обойтись: коллеги и заказчики есть в любой работе. Учитесь говорить кратко и по делу, а лишние встречи заменяйте письменными договорённостями."],
cI:["На практике это разработка продуктов, интерфейсов, дизайна, технических решений, контента. Подойдут программист, веб-дизайнер, конструктор, мультимедиа-дизайнер, креативный маркетолог.","творчество без дисциплины даёт недоделанные проекты. Идеи нужно доводить до результата, считать сроки и учитывать пожелания заказчика.","если вас не тянет создавать новое, это нормально: многие востребованные профессии строятся на надёжном воспроизведении проверенных решений. Но следите за обновлениями, иначе навыки быстро устареют."],
cS:["Здесь важны мастерство, глубокая подготовка и признанный уровень. Подойдут инженер-конструктор, радиотехник, сварщик, лаборант, врач узкой специальности, наладчик сложного оборудования.","глубокая специализация делает вас зависимым от рынка и технологий: если область устареет, придётся переучиваться. Следите за новинками и получайте сертификаты.","если узкая специализация вам не интересна, смотрите на широкие и проектные роли. Но для начала всё равно освойте одну базовую профессию на хорошем уровне: она станет опорой."],
cF:["Типичные задачи: оформлять и проверять документы, вести учёт, согласовывать, готовить отчёты. Подойдут бухгалтер, делопроизводитель, кадровик, кладовщик, специалист по закупкам.","рутина может незаметно съедать мотивацию, а ваша работа остаётся невидимой, пока всё идёт гладко. Просите чёткие критерии оценки и осваивайте автоматизацию, чтобы вырасти из исполнителя в организатора процесса.","если регламенты вам не по душе, ищите роли со свободой, но не игнорируйте документы: даже творческому специалисту приходится считать бюджеты и сдавать отчётность."],
cA:["В работе это разбор данных, поиск причин сбоев, прогнозы, оценка рисков. Подойдут аналитик, тестировщик, специалист по информационной безопасности, экономист, инженер по качеству, исследователь.","чрезмерный анализ затягивает решения, а работа с цифрами в одиночку ведёт к изоляции. Ставьте себе срок на вывод и проговаривайте результаты с коллегами.","если анализ вам не по душе, избегайте профессий со сложными расчётами. Но базовые навыки работы с данными нужны почти везде, освойте их хотя бы на минимальном уровне."],
cD:["Это планирование, контроль сроков, распределение ресурсов, ведение регламентов, организация работы офиса или склада. Подойдут администратор, логист, диспетчер, офис-менеджер, координатор проекта.","стремление к порядку может превратиться в излишний контроль и сопротивление переменам. Позволяйте себе гибкость там, где ошибка не критична.","если строгий порядок вам не близок, лучше подойдёт динамичная среда. Заведите минимальную систему: календарь, список задач и напоминания, чтобы сроки не горели."],
aC:["Подойдут бухгалтер, экономист, программист, инженер, финансовый аналитик, технолог.","не полагайтесь только на расчёты: цифры не заменяют общения и понимания людей.","если математика даётся тяжело, это не приговор: калькулятор, таблицы и привычка перепроверять решают большинство рабочих задач."],
aL:["Подойдут преподаватель, менеджер по продажам, журналист, юрист, HR-специалист, технический писатель.","красивая речь иногда скрывает слабое содержание: подкрепляйте слова фактами и результатами.","при бедной речи выручают шаблоны писем, чек-листы и привычка готовиться к выступлениям заранее."],
aE:["Подойдут консультант, педагог, журналист, менеджер по туризму, специалист по работе с клиентами.","широкий кругозор не заменяет глубины: выберите одну область и освойте её основательно.","узкий кругозор расширяется быстро: подкасты, документальные фильмы и книги по 20 минут в день дают результат за пару месяцев."],
aV:["Подойдут конструктор, чертёжник, дизайнер, архитектор, наладчик оборудования, радиомонтажник.","хорошая зрительная логика не гарантирует аккуратности в исполнении: проверяйте чертежи по чек-листу.","если пространственное мышление слабое, начинайте с простых схем и 3D-моделей: навык тренируется практикой."],
aA:["Подойдут юрист, аналитик, программист, исследователь, экономист, консультант.","сильная абстракция иногда отрывается от практики: проверяйте выводы на реальных примерах.","если абстрактные выводы даются трудно, работайте от конкретных примеров и применяйте готовые схемы рассуждений."],
aT:["Подойдут бухгалтер, корректор, контролёр качества, делопроизводитель, оператор станка, диспетчер.","высокая концентрация расходует силы: планируйте перерывы и смену деятельности.","при нестабильном внимании помогают список задач, таймер и рабочее место без отвлекающих факторов, а для критичных операций двойная проверка."]};
var OTH={0:[["Но сильная установка может приводить к перегрузке: учитесь говорить «нет» и планировать отдых.","Но излишняя уверенность в выбранном пути мешает прислушиваться к советам: сверяйте решения с наставником."],["Но это не фатально: небольшие регулярные цели и поддержка наставника быстро укрепляют установку.","Но слабая выраженность не мешает карьере, если выбрать среду с чёткими правилами и наставником."]],3:[["Но чрезмерная зависимость от одного мотива делает вас уязвимым: подстраховывайтесь запасными критериями выбора работы.","Но один мотив не должен заслонять остальные: учитывайте содержание работы и перспективы роста."],["Но слабый мотив не значит, что вопрос неважен: проверьте, не вытесняют ли его другие потребности.","Но со временем приоритеты меняются: возвращайтесь к этому пункту при смене работы."]],4:[["Но у любой сильной черты есть обратная сторона: в неподходящей роли она станет помехой.","Но слишком сильная черта может вызывать трения: учитывайте стиль коллег."],["Но слабая выраженность может быть преимуществом: вы не навязываете себя другим.","Но в нужных ситуациях эту сторону можно включать осознанно, это вопрос тренировки."]]};
